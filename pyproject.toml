[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-decision-engine"
version = "0.1.0"
description = "A small data pipeline for Fantasy Premier League data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "duckdb>=1.0",
    "highspy>=1.7,<2",
]

[project.scripts]
fpl-fetch = "fpl_decision_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
