name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install pinned uv 0.12.7
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          checksum: 788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21
          download-from-astral-mirror: false
          enable-cache: false
          restore-cache: false
          save-cache: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned age 1.3.1
        env:
          AGE_ARCHIVE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
          AGE_VERSION: v1.3.1
        run: |
          archive="$RUNNER_TEMP/age-$AGE_VERSION-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" \
            age/age age/age-keygen
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/age/age" --version
          "$RUNNER_TEMP/age/age-keygen" --version

      - name: Check Python lock
        run: uv lock --check --no-python-downloads

      - name: Sync locked Python environment
        run: uv sync --locked --no-python-downloads --no-cache

      - name: Run tests
        run: uv run --locked --no-sync --no-python-downloads --no-cache python -m unittest discover -s tests

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check generated web contracts
        working-directory: web
        run: npm run check:contracts

      - name: Test web application
        working-directory: web
        run: npm test

      - name: Type-check web application
        working-directory: web
        run: npm run typecheck

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Check web dependency boundary
        working-directory: web
        run: npm run check:boundary

      - name: Check patch whitespace
        run: git diff --check
