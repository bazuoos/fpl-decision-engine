name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned age 1.3.1
        env:
          AGE_ARCHIVE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
          AGE_VERSION: v1.3.1
        run: |
          archive="$RUNNER_TEMP/age-$AGE_VERSION-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" \
            age/age age/age-keygen
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/age/age" --version
          "$RUNNER_TEMP/age/age-keygen" --version

      - name: Install project
        run: python -m pip install --editable .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web application
        working-directory: web
        run: npm test

      - name: Type-check web application
        working-directory: web
        run: npm run typecheck

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Check web dependency boundary
        working-directory: web
        run: npm run check:boundary

      - name: Check patch whitespace
        run: git diff --check
